name: Publish certified release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version to publish, three-part, e.g. 2.3.4
        required: true
      confirm:
        description: Type publish-v<version> after Store certification
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  verify-store:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ inputs.version }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Confirm dispatch and repository release gates
        shell: pwsh
        run: |
          if ("${{ inputs.confirm }}" -ne "publish-v${{ inputs.version }}") { throw "Explicit publish confirmation is missing." }
          # The checked-out tag must be the version it claims to be.
          $pinned = (Get-Content plugins/nodestorm/VERSION -Raw).Trim()
          if ($pinned -ne "${{ inputs.version }}") { throw "Tag v${{ inputs.version }} pins version $pinned." }
          node scripts/validate-release.mjs --release --tag v${{ inputs.version }}
      - name: Install and confirm the certified Store package
        shell: pwsh
        run: |
          $identity = Get-Content packaging/windows/store-identity.json -Raw | ConvertFrom-Json
          & winget.exe install --id $identity.productId --source msstore --exact --accept-source-agreements --accept-package-agreements
          if ($LASTEXITCODE -ne 0) { throw "Microsoft Store listing is not live or installable." }
          $package = Get-AppxPackage -Name $identity.identityName |
            Where-Object {
              $_.Name -eq $identity.identityName -and
              $_.Publisher -eq $identity.publisher -and
              $_.Version.ToString() -eq "${{ inputs.version }}.0"
            } |
            Select-Object -First 1
          if (-not $package) { throw "Installed Store package identity, publisher, or version does not match certification." }
          $package | Remove-AppxPackage

  publish:
    needs: verify-store
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ inputs.version }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Configure Store-backed Windows setup
        run: node scripts/configure-store.mjs packaging/windows/store-identity.json
      - name: Revalidate package and publish through npm trusted publishing
        working-directory: plugins/nodestorm
        env:
          VERSION: ${{ inputs.version }}
        run: |
          npm test
          node ../../scripts/validate-npm-pack.mjs
          PUBLISHED_VERSION=$(npm view "nodestorm@$VERSION" version 2>/dev/null || true)
          if [ "$PUBLISHED_VERSION" = "$VERSION" ]; then
            PUBLISHED_REPOSITORY=$(npm view "nodestorm@$VERSION" repository.url)
            test "$PUBLISHED_REPOSITORY" = "git+https://github.com/robot-head/nodestorm.git"
          else
            npm publish --provenance --access public
          fi
      - name: Publish the existing GitHub draft idempotently
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          IS_DRAFT=$(gh release view "v$VERSION" --json isDraft --jq '.isDraft')
          if [ "$IS_DRAFT" = "true" ]; then
            gh release edit "v$VERSION" --draft=false
          elif [ "$IS_DRAFT" != "false" ]; then
            exit 1
          fi
